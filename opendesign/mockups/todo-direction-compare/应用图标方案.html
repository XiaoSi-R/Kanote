<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanote 应用图标方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    background:#f9fafb; color:#1f2937; padding:40px;
  }
  h2 { font-size:14px; font-weight:600; margin-bottom:16px; color:#6b7280; text-transform:uppercase; letter-spacing:.04em; }
  .section { margin-bottom:48px; }
  .icon-row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }

  .icon-card {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; padding:16px; border-radius:12px; border:2px solid transparent;
    transition:border-color .15s, box-shadow .15s;
  }
  .icon-card:hover { border-color:#6366f1; box-shadow:0 4px 16px rgba(99,102,241,.1); }
  .icon-card.selected { border-color:#6366f1; background:#eef2ff; }
  .icon-label { font-size:12px; font-weight:600; color:#6b7280; text-align:center; }
  .icon-sub { font-size:10px; color:#9ca3af; text-align:center; max-width:100px; }
  .icon-box { border-radius:16px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }

  /* 选中态 */
  input[type=radio] { display:none; }
  input[type=radio]:checked + .icon-card { border-color:#6366f1; background:#eef2ff; box-shadow:0 4px 16px rgba(99,102,241,.15); }
  input[type=radio]:checked + .icon-card .icon-label { color:#6366f1; }

  .size-row { display:flex; gap:12px; align-items:center; }
  .sz { font-size:10px; color:#9ca3af; text-align:center; }
</style>
</head>

<script>
  // 点击选中
  document.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener('change', function() {
      document.querySelectorAll('.icon-card').forEach(c => c.classList.remove('selected'));
      if (this.checked) this.nextElementSibling.classList.add('selected');
    });
  });
</script>
