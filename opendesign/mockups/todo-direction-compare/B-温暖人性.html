<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B · 温暖人性</title>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #fffdf9;
    --surface2: #f7f3eb;
    --border: #e8e0d3;
    --text: #3d3629;
    --text2: #8b7355;
    --text3: #b8a58e;
    --accent: #d4914a;
    --green: #7b9b5a;
    --orange: #d4914a;
    --red: #c46767;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(60,40,20,.06);
    --font: 'Georgia', 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text); padding:32px 40px;
    background-image: radial-gradient(ellipse at 50% 0%, rgba(212,145,74,.04) 0%, transparent 60%);
  }
  h2 { font-family:var(--font); font-size:18px; font-weight:400; color:var(--text2); margin-bottom:20px; letter-spacing:.01em; }

  .preview { display:flex; gap:24px; max-width:900px; }
  .col { flex:1; display:flex; flex-direction:column; gap:14px; }
  .col-header {
    display:flex; align-items:center; gap:10px;
    font-family:var(--font); font-size:13px; font-weight:400; color:var(--text2);
    padding-bottom:10px;
  }
  .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px rgba(0,0,0,.04); }
  .dot.todo { background:var(--orange); }
  .dot.done { background:var(--green); }
  .count { margin-left:auto; font-size:11px; color:var(--text3); background:var(--surface2); padding:2px 10px; border-radius:12px; }

  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 18px;
    box-shadow:var(--shadow);
    font-size:14px; line-height:1.6;
    transition: box-shadow .2s, transform .2s;
  }
  .card:hover { box-shadow:0 6px 20px rgba(60,40,20,.1); transform:translateY(-1px); }
  .card.done { opacity:.65; }
  .card.done .card-title { text-decoration:line-through; }
  .card.pinned { border-left:3px solid var(--orange); background:#fffbf5; }
  .card-title { font-size:14px; }
  .card-time { font-size:10px; color:var(--text3); margin-top:8px; font-family:var(--font); }
  .card-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-badge {
    font-size:10px; padding:3px 8px; border-radius:10px;
    background:var(--surface2); color:var(--text3); white-space:nowrap;
    font-family:var(--font);
  }
  .divider { height:1px; background:linear-gradient(to right,transparent,var(--border),transparent); margin:2px 0 8px; }

  .input-row {
    display:flex; gap:10px; margin-bottom:24px; max-width:900px;
  }
  .input-row input {
    flex:1; padding:12px 18px; border:1px solid var(--border);
    border-radius:var(--radius); font-size:14px; outline:none;
    background:var(--surface); color:var(--text);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.03);
  }
  .input-row input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(212,145,74,.08); }
  .input-row button {
    padding:12px 24px; background:var(--accent); color:#fff;
    border:none; border-radius:var(--radius); font-size:14px; cursor:pointer;
    font-weight:500; box-shadow:0 2px 8px rgba(212,145,74,.25);
    transition:box-shadow .15s, transform .15s;
  }
  .input-row button:hover { box-shadow:0 4px 14px rgba(212,145,74,.35); transform:translateY(-1px); }

  .label { position:absolute; top:12px; right:40px; font-size:11px; padding:4px 10px; border-radius:12px; background:var(--surface2); color:var(--text2); }
</style>
</head>
<body>
  <span class="label">B · 温暖人性</span>
  <h2>看板</h2>
  <div class="input-row">
    <input type="text" placeholder="今天想做什么？">
    <button>+ 添加</button>
  </div>
  <div class="preview">
    <div class="col">
      <div class="col-header">
        <span class="dot todo"></span> 待开始
        <span class="count">3</span>
      </div>
      <div class="card pinned">
        <div class="card-row"><span class="card-title">Design tokens 整理</span></div>
        <div class="card-time">上午 9:30</div>
      </div>
      <div class="card">
        <div class="card-row"><span class="card-title">暗色模式 CSS 变量迁移</span><span class="card-badge">tech</span></div>
        <div class="card-time">上午 11:00</div>
      </div>
      <div class="card">
        <div class="card-row"><span class="card-title">看板拖拽动画优化</span></div>
        <div class="card-time">下午 2:30</div>
      </div>
    </div>
    <div class="col">
      <div class="col-header">
        <span class="dot done"></span> 今天完成
        <span class="count">2</span>
      </div>
      <div class="card done">
        <div class="card-row"><span class="card-title">数据结构对齐</span></div>
        <div class="card-time">上午 10:15</div>
      </div>
      <div class="divider"></div>
      <div class="card done">
        <div class="card-row"><span class="card-title">API 接口联调</span></div>
        <div class="card-time">中午 12:00</div>
      </div>
    </div>
  </div>
</body>
</html>
