<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab 设计探索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    background:#f9fafb; color:#1f2937; padding:40px;
  }
  h3 { font-size:12px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .section { margin-bottom:48px; }

  /* ========================================
     通用变量
     ======================================== */
  .demo-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .accent { --a:#6366f1; --a-soft:#eef2ff; }

  /* ========================================
     方案 1: 胶囊分割 (当前基础上升级)
     ======================================== */
  .capsule-tabs {
    display:flex; gap:2px; background:#e5e7eb; border-radius:10px; padding:3px;
  }
  .capsule-tab {
    padding:8px 20px; border-radius:8px; font-size:13px; font-weight:500;
    border:none; background:transparent; color:#6b7280; cursor:pointer;
    transition:all .2s; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .capsule-tab.active {
    background:#fff; color:#1f2937;
    box-shadow:0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.03);
  }
  .capsule-tab .tab-icon { font-size:14px; }

  /* ========================================
     方案 2: 下划线滑动
     ======================================== */
  .underline-tabs {
    display:flex; gap:0; position:relative; border-bottom:2px solid #e5e7eb;
  }
  .underline-tab {
    padding:10px 20px; font-size:14px; font-weight:500;
    border:none; background:transparent; color:#9ca3af; cursor:pointer;
    transition:color .2s; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .underline-tab.active { color:#6366f1; }
  .underline-tab::after {
    content:''; position:absolute; bottom:-2px; left:20px; right:20px;
    height:2px; background:#6366f1; border-radius:1px;
    opacity:0; transition:opacity .2s;
  }
  .underline-tab.active::after { opacity:1; }
  .underline-tab .badge {
    font-size:10px; padding:1px 7px; border-radius:8px;
    background:#e5e7eb; color:#6b7280; font-weight:600;
  }
  .underline-tab.active .badge { background:#eef2ff; color:#6366f1; }

  /* ========================================
     方案 3: 图标按钮 + Tooltip
     ======================================== */
  .icon-tabs {
    display:flex; gap:6px;
  }
  .icon-tab {
    width:42px; height:42px; border-radius:10px; font-size:18px;
    border:1.5px solid #e5e7eb; background:#fff; color:#9ca3af; cursor:pointer;
    transition:all .2s; display:flex; align-items:center; justify-content:center;
  }
  .icon-tab.active {
    background:#eef2ff; border-color:#6366f1; color:#6366f1;
    box-shadow:0 0 0 3px rgba(99,102,241,.1);
  }
  .icon-tab:hover:not(.active) { border-color:#d1d5db; color:#6b7280; }

  /* ========================================
     方案 4: 极简文字 + 计数器
     ======================================== */
  .count-tabs {
    display:flex; gap:16px;
  }
  .count-tab {
    padding:6px 0; font-size:14px; font-weight:500;
    border:none; background:transparent; color:#9ca3af; cursor:pointer;
    display:flex; align-items:baseline; gap:6px; white-space:nowrap;
    transition:color .15s;
  }
  .count-tab.active { color:#1f2937; }
  .count-tab .num {
    font-size:20px; font-weight:700; line-height:1;
  }
  .count-tab.active .num { color:#6366f1; }

  /* ========================================
     方案 5: 滑动背景胶囊
     ======================================== */
  .slide-tabs {
    display:flex; position:relative; background:#f3f4f6; border-radius:12px; padding:4px;
  }
  .slide-bg {
    position:absolute; top:4px; height:calc(100% - 8px); border-radius:9px;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06);
    transition:left .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1);
    z-index:0;
  }
  .slide-tab {
    padding:8px 24px; font-size:13px; font-weight:500;
    border:none; background:transparent; color:#6b7280; cursor:pointer;
    position:relative; z-index:1; transition:color .2s; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .slide-tab.active { color:#1f2937; }
  .slide-tab .tab-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .slide-tab.active .tab-dot.board { background:#f59e0b; }
  .slide-tab.active .tab-dot.notes { background:#10b981; }

  /* ========================================
     方案 6: 竖排侧边标签 (打破横向习惯)
     ======================================== */
  .vert-tabs {
    display:flex; flex-direction:column; gap:2px; width:140px;
  }
  .vert-tab {
    padding:10px 14px; border-radius:8px; font-size:13px; font-weight:500;
    border:none; background:transparent; color:#6b7280; cursor:pointer;
    display:flex; align-items:center; gap:8px; text-align:left;
    transition:all .15s;
  }
  .vert-tab.active { background:#eef2ff; color:#6366f1; font-weight:600; }
  .vert-tab:hover:not(.active) { background:#f9fafb; }
  .vert-tab .vert-icon { font-size:16px; width:20px; text-align:center; }

  /* 方案 2 修正 — 每个 tab 需要 relative 定位才能用 ::after */
  .underline-tab { position:relative; }
</style>
</head>
<body>

<div class="section">
  <h3>1 · 胶囊分割（当前方案升级）</h3>
  <div class="demo-row">
    <div class="capsule-tabs">
      <button class="capsule-tab active"><span class="tab-icon">☰</span>看板</button>
      <button class="capsule-tab"><span class="tab-icon">✎</span>记录</button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">去掉 emoji，用简单符号；激活态白底 + 微阴影</p>
</div>

<div class="section">
  <h3>2 · 下划线滑动</h3>
  <div class="demo-row">
    <div class="underline-tabs">
      <button class="underline-tab active">看板<span class="badge">5</span></button>
      <button class="underline-tab">记录<span class="badge">12</span></button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">底部色条指示当前页，数字 badge 显示该 tab 内的待办/记录数量</p>
</div>

<div class="section">
  <h3>3 · 纯图标按钮</h3>
  <div class="demo-row">
    <div class="icon-tabs">
      <button class="icon-tab active" title="看板">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="icon-tab" title="记录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">节省空间，适合小窗/紧凑布局；hover 显示 label tooltip</p>
</div>

<div class="section">
  <h3>4 · 大字计数器</h3>
  <div class="demo-row">
    <div class="count-tabs">
      <button class="count-tab active"><span class="num">5</span> 待开始</button>
      <button class="count-tab"><span class="num">12</span> 条记录</button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">数字即导航，信息密度低时很有质感</p>
</div>

<div class="section">
  <h3>5 · 滑动激活块 + 色点</h3>
  <div class="demo-row">
    <div class="slide-tabs" id="slideDemo">
      <div class="slide-bg" style="left:4px;width:88px;"></div>
      <button class="slide-tab active" data-idx="0"><span class="tab-dot board"></span>看板</button>
      <button class="slide-tab" data-idx="1"><span class="tab-dot notes"></span>记录</button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">白色滑块平滑移动 + 小色点区分模块，最「有感觉」</p>
</div>

<div class="section">
  <h3>6 · 竖排侧标</h3>
  <div class="demo-row">
    <div class="vert-tabs">
      <button class="vert-tab active"><span class="vert-icon">☰</span>看板</button>
      <button class="vert-tab"><span class="vert-icon">✎</span>记录</button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:11px;color:#9ca3af;">适合左侧导航布局，和当前横向 header 不同方向</p>
</div>

<script>
  // 方案5点击切换滑动块位置
  document.getElementById('slideDemo').addEventListener('click', function(e) {
    const tab = e.target.closest('.slide-tab');
    if (!tab) return;
    const idx = parseInt(tab.dataset.idx);
    const bg = this.querySelector('.slide-bg');
    const tabs = this.querySelectorAll('.slide-tab');
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    // 计算位置
    let left = 4;
    for (let i = 0; i < idx; i++) {
      left += tabs[i].offsetWidth;
    }
    bg.style.left = left + 'px';
    bg.style.width = tab.offsetWidth + 'px';
  });
</script>

</body>
</html>
