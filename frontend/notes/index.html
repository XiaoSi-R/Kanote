<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/notes.css?v=3">
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="header">
  <h2>信息板</h2>
  <div class="tabs">
    <div class="tab">看板</div>
    <div class="tab active">记录</div>
  </div>
</div>

<!-- ===== 搜索 ===== -->
<div class="search-bar">
  <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
  <input class="search-input" type="text" placeholder="输入关键词搜索">
</div>

<!-- ===== 分类 ===== -->
<div class="cat-row">
  <span class="cat active" data-cat="全部"> 全部</span>
  <span class="cat-add">+</span>
</div>

<!-- ===== 笔记列表 ===== -->
<div class="list" id="noteList">
  <div class="empty-hint" style="padding:40px;text-align:center;color:var(--text3);font-size:13px;">暂无记录，点击右下角 + 新建</div>
</div>

<div class="quick-hint">
  点击条目进入全屏编辑 · 复制按钮直接带走 · <kbd>Ctrl+K</kbd> 聚焦搜索
</div>

<!-- 新建按钮 -->
<button class="fab" id="addBtn" onclick="App.addNote()" title="新建记录">+</button>

<!-- ===== 全屏编辑器 ===== -->
<div class="editor-shell" id="editorShell" style="display:none;">
  <div class="editor-inner">
    <div class="editor-topbar">
      <button class="back-btn" onclick="Editor.close()">← 返回</button>
      <span class="title-hint">编辑记录</span>
      <button class="delete-btn" onclick="Editor.remove()">🗑 删除</button>
      <button class="save-btn" onclick="Editor.save()">保存</button>
    </div>
    <div class="editor-body">
      <input class="editor-title" id="editTitle" placeholder="输入标题…">
      <select class="editor-cat" id="editCat"></select>
      <textarea class="editor-textarea" id="editContent" placeholder="粘贴或输入内容…支持多行文本、命令、链接等"></textarea>
    </div>
  </div>
</div>

<!-- JS 模块 -->
<script src="js/api.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>

</body>
</html>
